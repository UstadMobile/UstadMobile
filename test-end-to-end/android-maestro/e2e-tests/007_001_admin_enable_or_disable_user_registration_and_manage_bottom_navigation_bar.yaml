appId: com.toughra.ustadmobile
env:
  TESTRESULTSDIR: "build/reports/maestro/007_001_admin_enable_or_disable_user_registration_and_manage_bottom_navigation_bar/Screenshots"
onFlowStart:
  - startRecording: 007_001_admin_enable_or_disable_user_registration_and_manage_bottom_navigation_bar
  - runScript:
      file: "common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - stopRecording
  - runScript:
      file: "common/stopserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
- runScript:
    file: "common/import_users_via_http.js"
    env:
      TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
      IMPORT_FROM_CSV_FILE: "Ustad_Teacher_and_Students.csv"

#admin enable user registration
- runFlow: "common/clear_state_and_learning_space_existing_userflow.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
   file: "common/admin_login.yaml"
- runFlow:
    file: "common/enable_user_registration.yaml"
- assertVisible: "Yes"
- runFlow: "common/clear_state_and_learning_space_new_userflow.yaml"
- runFlow: "common/select_site.yaml"
- tapOn: "Next"
- assertVisible: "This field is required" #verify the DOB field is mandatory
- tapOn: 2025
- longPressOn: 2025
- inputText: 2009
- hideKeyboard
- tapOn: 2009
- tapOn: "* Required"
- tapOn: "Next"
- extendedWaitUntil:
    visible:  "Terms and company policies"
    timeout: 10000
- tapOn: "Accept"
- tapOn: "Other options"
- assertVisible:
    below:  "Full name*"
    text: "This field is required" #verify the Fullname field's mandatory
- assertVisible:
    below:  "Gender*"
    text: "This field is required" #verify the Gender field's mandatory
- tapOn: "Full name*"
- inputText: "User ABC"
- tapOn: "Gender*"
- tapOn: "Female"
- tapOn: "Other options"
- tapOn: "Create username and password"
- tapOn: "Sign-up"
- assertVisible:
    below:  "Password"
    text: "This field is required" #verify the Password field's mandatory
- tapOn: "Password"
- inputText: "test1234"
- tapOn: "Sign-up"
- assertVisible: "Courses"

#admin disable user registration
- runFlow: "common/clear_state_and_learning_space_existing_userflow.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/admin_login.yaml"
- tapOn: "Library"
- tapOn: "Settings"
- tapOn: "Site"
- tapOn:
    id: "floating_action_button"
- tapOn:
    id: "registration_allowed"
- tapOn: "Save"
- assertNotVisible: "Yes"
- runFlow: "common/clear_state_and_learning_space_new_userflow.yaml"
- runFlow: "common/select_site.yaml"
- assertVisible: "Learning space does not allow new user registration"

#admin user can manage visibility of buttons in bottom navigation bar
- runFlow: "common/clear_state_and_learning_space_existing_userflow.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/admin_login.yaml"
- tapOn: "Settings"
- tapOn: "Site"
- tapOn:
    id: "floating_action_button"  #Edit button
- tapOn: "Messages"
- tapOn: "People"
- tapOn: "Save"
- assertVisible: "Courses"
- assertVisible: "Library"
- assertNotVisible: "Messages"
- assertNotVisible: "People"
- runFlow: "common/clear_state_and_learning_space_existing_userflow.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "teach1"
      PASSWORD: "testt1"
- assertVisible: "Courses"
- assertVisible: "Library"
- assertNotVisible: "Messages"
- assertNotVisible: "People"
- runFlow: "common/clear_state_and_learning_space_existing_userflow.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "stud1"
      PASSWORD: "tests1"
- assertVisible: "Courses"
- assertVisible: "Library"
- assertNotVisible: "Messages"
- assertNotVisible: "People"