appId: com.toughra.ustadmobile
env:
  TESTRESULTSDIR: "build/reports/maestro/003_005_add_new_content_block_inside_course/Screenshots"
onFlowStart:
  - startRecording: 003_005_add_new_content_block_inside_course
  - runScript:
      file: "../common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
        TESTSERIAL: ${TESTSERIAL}
        TESTNAME: ${TESTNAME}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - stopRecording
  - runScript:
      file: "../common/stopserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
- runFlow: "../common/clear_state_and_get_started.yaml"
- runFlow: "../common/select_site.yaml"
- runFlow:
    file: "../common/admin_login.yaml"
- runFlow:
    file: "../common/add_course.yaml"
    env:
      TESTCOURSENAME: "New Content Block Test"
- runFlow:
    file: "../common/add_new_teacher_inside_course.yaml"
    env:
      TESTCOURSENAME: "New Content Block Test"
      TEACHERFIRSTNAME: "Teacher"
      TEACHERLASTNAME: "1"
      USERNAME: "teach1"
      GENDER: "Female"
      PASSWORD: "testt1"
- repeat:
    while:
      notVisible: "Course"
    commands:
      - back
- tapOn: "Course"
- runFlow:
    file: "../common/add_new_content_block_to_course.yaml"
    env:
      TESTFILENAME: "H5p_Content.h5p"
- scrollUntilVisible:
    element:
      text:  "True/False Question"
    direction: DOWN
- assertVisible:
    text:  "True/False Question"
- runFlow: "../common/clear_state_and_get_started.yaml"
- runFlow: "../common/select_site.yaml"
- runFlow:
    file: "../common/user_login.yaml"
    env:
      USERNAME: "teach1"
      PASSWORD: "testt1"
- tapOn: "courses"
- tapOn: "New Content Block Test"
- runFlow:
    file: "../common/add_new_content_block_to_course.yaml"
    env:
      TESTFILENAME: Epub_Content1.epub
- scrollUntilVisible:
    element:
      text:  "The Adopting of Rosa Marie / (A Sequel to Dandelion Cottage)"
    direction: DOWN
- assertVisible:
    text:  "True/False Question"
- scrollUntilVisible:
    element:
      text:  "The Adopting of Rosa Marie / (A Sequel to Dandelion Cottage)"
    direction: DOWN
- assertVisible:
    text: "The Adopting of Rosa Marie / (A Sequel to Dandelion Cottage)"