appId: com.toughra.ustadmobile
tags:
  - courseBlocks
env:
  TESTRESULTSDIR: "build/reports/maestro/003_005_add_new_content_block_inside_course/Screenshots"
  TESTCOURSENAME: "Test Course Block"
onFlowStart:
  - startRecording: 003_005_add_new_content_block_inside_course
  - runScript:
      file: "common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - stopRecording
  - runScript:
      file: "common/stopserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
# Import course, students, and teacher
- runScript:
    file: "common/import_users_via_http.js"
    env:
      TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
      IMPORT_FROM_CSV_FILE: "Ustad_Teacher_and_Students.csv"
# Download test file 1
- runFlow:
    file: "common/download_file_via_browser.yaml"
    env:
      TESTFILENAME: "H5p_Content.h5p"
# Download test file2
- runFlow:
    file: "common/download_file_via_browser.yaml"
    env:
      TESTFILENAME: "Epub_Content1.epub"

- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "teach1"
      PASSWORD: "testt1"
- tapOn: ${TESTCOURSENAME}
# verify content block title is mandatory
- tapOn:
    id: "floating_action_button"
- tapOn: "Add block"
- tapOn: "Content"
- tapOn: "My content"
- tapOn: "Import from file"
- runFlow:
    file: "common/select_file_from_picker.yaml"
    env:
      TESTFILENAME: H5p_Content.h5p
- longPressOn: "True/False Question"
- tapOn: "Select all"
- eraseText
- tapOn: "Next"
#Assertion to make sure the page is not saved because title is blank
- assertNotVisible:
    id: "app_title"
    text: "Edit content block"
- hideKeyboard
- back
- back
- tapOn: "Save"
- runFlow:
    file: "common/add_new_content_block_to_course.yaml"
    env:
      TESTFILENAME: "H5p_Content.h5p"
- scrollUntilVisible:
    element:
      text:  "True/False Question"
    direction: DOWN
- assertVisible:
    text:  "True/False Question"
- runFlow:
    file: "common/add_new_content_block_to_course.yaml"
    env:
      TESTFILENAME: Epub_Content1.epub
- scrollUntilVisible:
    element:
      text:  "The Adopting of Rosa Marie / (A Sequel to Dandelion Cottage)"
    direction: DOWN
- assertVisible:
    text:  "True/False Question"
- scrollUntilVisible:
    element:
      text:  "The Adopting of Rosa Marie / (A Sequel to Dandelion Cottage)"
    direction: DOWN
- assertVisible:
    text: "The Adopting of Rosa Marie / (A Sequel to Dandelion Cottage)"
  # Student 1 attempt video content
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "stud1"
      PASSWORD: "tests1"
- tapOn: "Test Course Block"
- scrollUntilVisible:
    element:
      text: "Video"
    direction: DOWN
- tapOn: "Video"
- tapOn: "Open"
- tapOn: "Play"
- extendedWaitUntil:
    visible: "Play"
    timeout: 20000
- back
# Verify student able to see attempts made in course content
- tapOn: "Attempts"
- assertVisible: "Student 1"
- assertVisible: "100% Completion"
- tapOn: "Student 1"
- assertVisible: "Completed"
- assertVisible: "100% Completion"
- tapOn: "Completed"
- assertVisible: "Completed"
- assertVisible:
    text: "Completion: 100%"
    index: 0
- assertVisible: "Progressed"
- assertVisible:
    text: "Completion: 100%"
    index: 1
- assertVisible: "Completed"
- assertVisible: "Progressed"
  # Student 2 attempt H5p content
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "stud2"
      PASSWORD: "tests2"
- tapOn: "Courses"
- tapOn: "Test Course Block"
- tapOn: "True/False Question"
- tapOn: Open
- runFlow:
    file: "common/chrome-first-run-check.yaml"
# Student answered wrong
- tapOn: "No "
- tapOn: "Check"
- tapOn: "Close tab"
- tapOn: "Attempts"
- assertVisible: "Student 2"
- assertVisible: "1 Attempts"
- tapOn: "Student 2"
- assertVisible: "Failed"
- assertVisible: "0% Score"
- tapOn: "Failed"
# verify filters are working
- tapOn:
    text: "Answered"
    index: 0
- assertVisible: "Score: 0 / 1"
# Student 3 makes attempt on H5p content
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "stud3"
      PASSWORD: "tests3"
- tapOn: "Courses"
- tapOn: "Test Course Block"
- tapOn: "True/False Question"
- tapOn: Open
- runFlow:
    file: "common/chrome-first-run-check.yaml"
- tapOn: "Yes "
- tapOn: "Check"
- tapOn: "Close tab"
# Verify student 3 able to see attempts made in course content
- tapOn: "Attempts"
- assertVisible: "Student 3"
- assertVisible: "1 Attempts"
- assertVisible: "100% Score"
- tapOn: "Student 3"
- assertVisible: "Passed"
- assertVisible: "100% Score"
- tapOn: "Passed"
# verify filters are working
- tapOn:
    text: "Answered"
    index: 0
- assertVisible: "Score: 1 / 1"
# verify teacher able to see students attempts
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "teach1"
      PASSWORD: "testt1"
- tapOn: "Test Course Block"
- tapOn: "True/False Question"
# Verify teacher able to see attempts made in course content
- tapOn: "Attempts"
- assertVisible: "Student 2"
- assertVisible: "1 Attempts"
- assertVisible: "Student 3"
- assertVisible: "1 Attempts"
- assertVisible: "100% Score"
- tapOn: "Student 2"
- assertVisible: "Failed"
- assertVisible: "0% Score"
- tapOn: "Failed"
# verify filters are working
- assertVisible: "Score: 0 / 1"
- back
- back
- tapOn: "Student 3"
- assertVisible: "Passed"
- assertVisible: "100% Score"
- tapOn: "Passed"
# verify filters are working
- tapOn:
    text: "Answered"
    index: 0
- assertVisible: "Score: 1 / 1"
- tapOn: "Courses"
- tapOn: "Test Course Block"
- scrollUntilVisible:
    element:
      text: "Video"
    direction: DOWN
- tapOn: "Video"
- tapOn: "Attempts"
- assertVisible: "Student 1"
- assertVisible: "100% Completion"
- tapOn: "Student 1"
- assertVisible: "Completed"
- assertVisible: "100% Completion"
- tapOn: "Completed"
- assertVisible: "Completed"
- assertVisible:
    text: "Completion: 100%"
    index: 0
- assertVisible: "Progressed"
- assertVisible:
    text: "Completion: 100%"
    index: 1
  # Verify student 1 not able to see attempts made in course content by Student 2
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "stud1"
      PASSWORD: "tests1"
- tapOn: "Test Course Block"
- tapOn: "True/False Question"
- tapOn: "Attempts"
- assertVisible: "Nothing here, yet"
