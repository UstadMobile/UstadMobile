appId: com.toughra.ustadmobile
env:
  TESTNAME: "002_009_people_add_and_remove_profile_pic"
  TESTRESULTSDIR: "${TESTRESULTSDIR}/002_009_people_add_and_remove_profile_pic"
onFlowStart:
  - runScript:
      file: "../common/startserver.js"
      env:
        CONTROLSERVER_URL: ${CONTROLSERVER_URL}
        TESTSERIAL: ${TESTSERIAL}
        TESTNAME: ${TESTNAME}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - runScript:
      file: "../common/stopserver.js"
      env:
        CONTROLSERVER_URL: ${CONTROLSERVER_URL}
---
- runFlow:
    file: "../common/add_profile_pic.yaml"
    env:
      TESTFILENAME: "admin_profilePic.jpg"
      CONTROLSERVER_URL: ${CONTROLSERVER_URL}
      TESTSERIAL: ${TESTSERIAL}
- assertVisible:
    id: "person_picture"
- tapOn:
    id: "floating_action_button"
- tapOn: "Add"
- tapOn: "Remove picture"
- tapOn: "Save"
- assertNotVisible:
    id: "person_picture"