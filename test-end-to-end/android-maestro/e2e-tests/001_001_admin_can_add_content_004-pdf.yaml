appId: com.toughra.ustadmobile
tags:
  - contentPdf
  - contentTest
env:
  TESTRESULTSDIR: "build/reports/maestro/001_001_admin_can_add_content_004-pdf/Screenshots"
onFlowStart:
  - startRecording: 001_001_admin_can_add_content_004-pdf
  - runScript:
      file: "common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - stopRecording
  - runScript:
      file: "common/stopserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
- runFlow:
    file: "common/clear_login_and_add_content.yaml"
    env:
      TESTFILENAME: Pdf_Content.pdf
- tapOn: "SAVE"
- takeScreenshot: "${TESTRESULTSDIR}//content_add_to_library"
- tapOn: "Document"
- extendedWaitUntil:
    notVisible: "Importing"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "Uploading"
    timeout: 10000
- tapOn: Open
- assertVisible: "PDF PAGE"
- tapOn: "Back"
- runFlow:
    file: "common/login_download_and_open_content.yaml"
#Download and open content
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Document"
    timeout: 60000
- tapOn: "Document"
- tapOn: Download
- tapOn: Open
- assertVisible: "PDF PAGE"
- scroll
- takeScreenshot: "${TESTRESULTSDIR}/pdf_content_download_and_open"
- tapOn: "Back"
- tapOn: "Attempts"
- assertVisible:
    text: "Pdf_Content"
    id: "app_title"
- assertVisible: "Admin User"
- assertVisible: "1 Attempts"
- tapOn: "100% completion"
- tapOn: "Admin User"
- assertVisible:
    text: "Admin User - Pdf_Content"
    id: "app_title"
- assertVisible: "Completed"
- assertVisible: "100% completion"
- tapOn: "Completed"
- assertVisible:
    text: "Pdf_Content"
    id: "app_title"
- assertVisible:
    text: "Completed"    # filter is unselected
    index: 1
- assertVisible: "100% completion"
- tapOn:
    text: "Completed"    # filter is unselected
    index: 0
- assertNotVisible: "100% completion"
