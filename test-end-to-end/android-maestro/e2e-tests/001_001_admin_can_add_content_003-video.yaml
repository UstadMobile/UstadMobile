appId: com.toughra.ustadmobile
env:
  TESTRESULTSDIR: "${TESTRESULTSDIR}/001_001_admin_can_add_content_003-video"
  TESTNAME: "001_001_admin_can_add_content_003-video"
onFlowStart:
  - runScript:
      file: "../common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
        TESTSERIAL: ${TESTSERIAL}
        TESTNAME: ${TESTNAME}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - runScript:
      file: "../common/stopserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
- runFlow:
    file: "../common/clear_login_and_add_content.yaml"
    env:
      TESTFILENAME: Video_Content.mp4
      TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
      TESTSERIAL: ${TESTSERIAL}
- tapOn: "SAVE"
- takeScreenshot: "${TESTRESULTSDIR}/screenshots/content_add_to_library"
- tapOn: "Video"
- extendedWaitUntil:
    notVisible: "Importing"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Uploading"
    timeout: 20000
- tapOn: Open
- assertVisible: "Play"
- runFlow:
    file: "../common/login_download_and_open_content.yaml"
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Video"
    timeout: 60000
- tapOn: "Video"
- tapOn: Download
- tapOn: Open
- tapOn: "Play"
- extendedWaitUntil:
    visible: "Play"
    timeout: 20000
- takeScreenshot: "${TESTRESULTSDIR}/screenshots/video_content_download_and_open"