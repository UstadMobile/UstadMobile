appId: com.toughra.ustadmobile
tags:
  - contentVideo
  - contentTest
env:
  TESTRESULTSDIR: "build/reports/maestro/001_001_admin_can_add_content_003-video/Screenshots"
onFlowStart:
  - startRecording: 001_001_admin_can_add_content_003-video
  - runScript:
      file: "common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - stopRecording
  - runScript:
      file: "common/stopserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
- runFlow:
    file: "common/clear_login_and_add_content.yaml"
    env:
      TESTFILENAME: Video_Content.mp4
- tapOn: "SAVE"
- takeScreenshot: "${TESTRESULTSDIR}/content_add_to_library"
- tapOn: "Video"
- extendedWaitUntil:
    notVisible: "Importing"
    timeout: 60000
- extendedWaitUntil:
    notVisible: "Uploading"
    timeout: 60000
- tapOn: Open
- assertVisible: "Play"
- runFlow:
    file: "common/login_download_and_open_content.yaml"
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Video"
    timeout: 60000
- tapOn: "Video"
- tapOn: Download
- tapOn: Open
- tapOn: "Play"
- extendedWaitUntil:
    visible: "Play"
    timeout: 20000
- takeScreenshot: "${TESTRESULTSDIR}/video_content_download_and_open"
- tapOn: "Back"
- tapOn: "Attempts"
- assertVisible:
    text: "Video_Content.mp4"
    id: "app_title"
- assertVisible: "Admin User"
- assertVisible: "1 Attempts"
- assertVisible: "100% Completion"
- tapOn: "Admin User"
- assertVisible:
    text: "Admin User - Video_Content.mp4"
    id: "app_title"
- assertVisible: "Completed"
- assertVisible: "100% Completion"
- tapOn: "Completed"
- assertVisible:
    text: "Video_Content.mp4"
    id: "app_title"
- assertVisible:
    text: "Completed"  #completed selected by default
    index: 0
- assertVisible:
    text: "Completed"
    index: 1
- assertVisible: "100% completion"
- tapOn:
    text: "Completed"
    index: 0
- assertVisible:
    text: "Progressed"
    index: 1
- assertVisible:
    id: "progress_bar"
- tapOn:
    text: "Progressed"
    index: 0
- assertVisible: "Nothing here, yet"
