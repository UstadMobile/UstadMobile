appId: com.toughra.ustadmobile
env:
  TESTRESULTSDIR: "${TESTRESULTSDIR}/001_005_admin_can_remove_content_and_download_again"
  TESTNAME: "001_005_admin_can_remove_content_and_download_again"
onFlowStart:
  - runScript:
      file: "../common/startserver.js"
      env:
        CONTROLSERVER_URL: ${CONTROLSERVER_URL}
        TESTSERIAL: ${TESTSERIAL}
        TESTNAME: ${TESTNAME}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - runScript:
      file: "../common/stopserver.js"
      env:
        CONTROLSERVER_URL: ${CONTROLSERVER_URL}
---
- runFlow:
    file: "../common/clear_login_and_add_content.yaml"
    env:
      TESTFILENAME: Epub_Content2.epub
      CONTROLSERVER_URL: ${CONTROLSERVER_URL}
      TESTSERIAL: ${TESTSERIAL}
- tapOn: "SAVE"
- takeScreenshot: "${TESTRESULTSDIR}/screenshots/content_add_to_library"
- tapOn: "E-book"
- assertNotVisible: "Importing"
- tapOn: Open
- tapOn: "Back"
- runFlow:
    file: "../common/login_download_and_open_content.yaml"
#Download and open content
- tapOn: "Library"
- extendedWaitUntil:
    visible: "E-book"
    timeout: 3000
- tapOn: "E-book"
- tapOn: Download
- assertVisible: "Remove"
- tapOn: Remove
- tapOn: Download
- tapOn: Open
- takeScreenshot: "${TESTRESULTSDIR}/screenshots/content_download_and_open"
