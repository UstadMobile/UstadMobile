appId: com.toughra.ustadmobile
tags:
  - invalidContent
  - contentTest
env:
  TESTRESULTSDIR: "build/reports/maestro/001_002_admin_add_invalid_content_gets_error_msg/Screenshots"
onFlowStart:
  - startRecording: 001_002_admin_add_invalid_content_gets_error_msg
  - runScript:
        file: "common/startserver.js"
        env:
          TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
    - stopRecording
    - runScript:
        file: "common/stopserver.js"
        env:
          TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
- runFlow:
    file: "common/clear_login_and_add_content.yaml"
    env:
      TESTFILENAME: Invalid_Video_Content.mp4
- assertVisible:  "Invalid file : Exception importing what looked like video"
- takeScreenshot: "${TESTRESULTSDIR}//invalid_content_type_error"