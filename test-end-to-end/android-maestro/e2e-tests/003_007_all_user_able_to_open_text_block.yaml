appId: com.toughra.ustadmobile
tags:
  - courseBlocks
env:
  TESTRESULTSDIR: "build/reports/maestro/003_007_all_user_able_to_open_text_block/Screenshots"
  TEXTTITLE: "PRIMARY COLOURS"
onFlowStart:
  - startRecording: 003_007_all_user_able_to_open_text_block
  - runScript:
      file: "common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - stopRecording
  - runScript:
      file: "common/stopserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/admin_login.yaml"
- runFlow:
    file: "common/add_course.yaml"
    env:
      TESTCOURSENAME: "Text Block Test"
- runFlow:
    file: "common/add_new_teacher_inside_course.yaml"
    env:
      TESTCOURSENAME: "Text Block Test"
      TEACHERFIRSTNAME: "Teacher"
      TEACHERLASTNAME: "1"
      USERNAME: "teach1"
      GENDER: "Female"
      PASSWORD: "testt1"
- tapOn:
    text: "Courses"
    index: 1
- runFlow:
    file: "common/add_new_student_inside_course.yaml"
    env:
      TESTCOURSENAME: "Text Block Test"
      STUDENTFIRSTNAME: "Student"
      STUDENTLASTNAME: "1"
      USERNAME: "stud1"
      GENDER: "Male"
      PASSWORD: "tests1"
- repeat:
    while:
      notVisible: "Course"
    commands:
      - back
- tapOn: "Course"
- runFlow:
    file: "common/add_demo_block_structure.yaml"
    env:
      MODULETITLE: "SEMESTER 1"
      TEXTTITLE: "PRIMARY COLOURS"
      TEXT: "RED,BLUE,GREEN"
- scrollUntilVisible:
    element:
      text: ${TEXTTITLE}
    direction: DOWN
- tapOn:
    text: ${TEXTTITLE}
- extendedWaitUntil:
    visible: ${TEXTTITLE}
    timeout: 1000
- assertVisible:
          text: "RED,BLUE,GREEN"
- takeScreenshot: "${TESTRESULTSDIR}/text_block_admin_view"
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "stud1"
      PASSWORD: "tests1"
- tapOn: "courses"
- tapOn: "Text Block Test"
#--- open text block by student---#
- scrollUntilVisible:
    element:
      text: ${TEXTTITLE}
    direction: DOWN
- tapOn: "PRIMARY COLOURS"
- extendedWaitUntil:
    visible: ${TEXTTITLE}
    timeout: 1000
- assertVisible:
    text: "RED,BLUE,GREEN"
- takeScreenshot: "${TESTRESULTSDIR}/text_block_student_view"
#---------Launch App & Teacher Login------------------#
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "teach1"
      PASSWORD: "testt1"
- tapOn: "courses"
- tapOn: "Text Block Test"
#--- open text block by teacher ---#
- scrollUntilVisible:
    element:
      text: ${TEXTTITLE}
    direction: DOWN
- tapOn: "PRIMARY COLOURS"
- extendedWaitUntil:
    visible: ${TEXTTITLE}
    timeout: 1000
- assertVisible:
    text: "RED,BLUE,GREEN"
- takeScreenshot: "${TESTRESULTSDIR}/text_block_teacher_view"