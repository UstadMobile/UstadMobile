appId: com.toughra.ustadmobile
env:
  TESTRESULTSDIR: "build/reports/maestro/001_010_content_attempt_list_test/Screenshots"
onFlowStart:
  - startRecording: 001_010_content_attempt_list_test
  - runScript:
      file: "common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
  - clearState: com.toughra.ustadmobile

---
- runScript:
    file: "common/import_users_via_http.js"
    env:
      TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
      IMPORT_FROM_CSV_FILE: "Ustad_Teacher_and_Students.csv"
# Download test file 1
- runFlow:
    file: "common/download_file_via_browser.yaml"
    env:
      TESTFILENAME: "H5p_Content.h5p"
# Download test file2
- runFlow:
    file: "common/download_file_via_browser.yaml"
    env:
      TESTFILENAME: "Video_Content.mp4"
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/admin_login.yaml"
- tapOn: "Courses"
- tapOn: "Test Course Block"
- runFlow:
    file: "common/add_new_content_block_to_course.yaml"
    env:
      TESTFILENAME: "H5p_Content.h5p"
- scrollUntilVisible:
    element:
      text:  "True/False Question"
    direction: DOWN
- assertVisible:
    text:  "True/False Question"
- tapOn: "True/False Question"
- extendedWaitUntil:
    notVisible: "Importing"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Uploading"
    timeout: 30000
- tapOn: Open
- runFlow:
    file: "common/chrome-first-run-check.yaml"
- assertVisible: "Check"
- tapOn: "Close tab"
- tapOn: "Courses"
- tapOn: "Test Course Block"
- runFlow:
    file: "common/add_new_content_block_to_course.yaml"
    env:
      TESTFILENAME: "Video_Content.mp4"
- scrollUntilVisible:
    element:
      text: "Video"
    direction: DOWN
- tapOn: "Video"
- extendedWaitUntil:
    notVisible: "Importing"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Uploading"
    timeout: 20000
- tapOn: Open
- assertVisible: "Play"
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "stud1"
      PASSWORD: "tests1"
- tapOn: "Test Course Block"
- scrollUntilVisible:
    element:
      text: "Video"
    direction: DOWN
- tapOn: "Video"
- tapOn: "Open"
- tapOn: "Play"
- extendedWaitUntil:
    visible: "Play"
    timeout: 20000
- back
- tapOn: "Courses"
- tapOn: "Test Course Block"
- tapOn: "True/False Question"
- tapOn: Open
- runFlow:
    file: "common/chrome-first-run-check.yaml"
- tapOn: "Yes "
- tapOn: "Check"
- tapOn: "Close tab"
  # Verify student able to see attempts made in course content
- tapOn: "Attempts"
- assertVisible: "Student 1"
- assertVisible: "100% Score"
- tapOn: "Student 1"
- assertVisible: "Passed"
- assertVisible: "100% Score"
- tapOn: "Passed"
- assertVisible: "Attempted"
- assertVisible: "Interacted"
- assertVisible: "Answered"
- assertVisible: "1/1 Score"
- tapOn: "Courses"
- tapOn: "Test Course Block"
- scrollUntilVisible:
    element:
      text: "Video"
    direction: DOWN
- tapOn: "Video"
  # Verify student able to see attempts made in course content
- tapOn: "Attempts"
- assertVisible: "Student 1"
- assertVisible: "100% Completion"
- tapOn: "Student 1"
- assertVisible: "Completed"
- assertVisible: "100% Completion"
- tapOn: "Completed"
- assertVisible: "Completed"
- assertVisible:
    text: "100% Completion"
    index: 0
- assertVisible: "Progressed"
- assertVisible:
    text: "100% Completion"
    index: 1
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "teach1"
      PASSWORD: "testt1"
- tapOn: "Test Course Block"
- tapOn: "True/False Question"
  # Verify teacher able to see attempts made in course content
- tapOn: "Attempts"
- assertVisible: "Student 1"
- assertVisible: "100% Score"
- tapOn: "Student 1"
- assertVisible: "Passed"
- assertVisible: "100% Score"
- tapOn: "Passed"
- assertVisible: "Attempted"
- assertVisible: "Interacted"
- assertVisible: "Answered"
- assertVisible: "1/1 Score"
- tapOn: "Courses"
- tapOn: "Test Course Block"
- scrollUntilVisible:
    element:
      text: "Video"
    direction: DOWN
- tapOn: "Video"
- tapOn: "Attempts"
- assertVisible: "Student 1"
- assertVisible: "100% Completion"
- tapOn: "Student 1"
- assertVisible: "Completed"
- assertVisible: "100% Completion"
- tapOn: "Completed"
- assertVisible: "Completed"
- assertVisible:
    text: "100% Completion"
    index: 0
- assertVisible: "Progressed"
- assertVisible:
    text: "100% Completion"
    index: 1
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "stud2"
      PASSWORD: "tests2"
- tapOn: "Test Course Block"
- tapOn: "True/False Question"
  # Verify student 2 not able to see attempts made in course content by Student 1
- tapOn: "Attempts"
- assertNotVisible: "Student "