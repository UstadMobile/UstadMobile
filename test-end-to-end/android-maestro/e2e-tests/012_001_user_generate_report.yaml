appId: com.toughra.ustadmobile
env:
  TESTRESULTSDIR: "build/reports/maestro/012_001_user_generate_report/Screenshots"
onFlowStart:
  - startRecording: 012_001_user_generate_report
  - runScript:
      file: "common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - stopRecording
  - runScript:
      file: "common/stopserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
# Download test file
- runFlow:
    file: "common/download_file_via_browser.yaml"
    env:
      TESTFILENAME: "Video_Content.mp4"
- runScript:
    file: "common/import_users_via_http.js"
    env:
      TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
      IMPORT_FROM_CSV_FILE: "Ustad_Teacher_and_Students.csv"

# verify admin able to generate Report
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
     file: "common/admin_login.yaml"
- tapOn: "courses"
- tapOn: "Test Course Block"
- runFlow:
    file: "common/add_new_content_block_to_course.yaml"
    env:
      TESTFILENAME: "Video_Content.mp4"
- runScript:
    file: "common/generate_content_usage_data_via_http.js"
    env:
      TESTFILENAME: "Video_Content.mp4"
      USERNAME: "stud1"
- tapOn: "Reports"
- assertVisible:
    text: "Reports"
    id: "app_title"
- tapOn:
    id: "floating_action_button"      # +Report button
- assertVisible:
    text: "Add a new report"
    id: "app_title"
- tapOn: "Title*"
- inputText: "Test Report"
- tapOn: "Time range*"
- tapOn: "Custom date range"
- tapOn:
    text: "dd/mm/yyyy"
    index: 0
- runScript:
    file: "common/setDate.js"
- inputText: ${output.yesterdayDate}
- tapOn: "dd/mm/yyyy"
- runScript:
    file: "common/setDate.js"
- inputText: ${output.currentDate}
- tapOn: "X Axis*"
- tapOn: "Day"
- tapOn: "Series Title*"
- inputText: "Series 1"
- hideKeyboard
- tapOn: "Y Axis*"
- tapOn: "Total Duration"
- scrollUntilVisible:
    element:
      text: "Chart type*"
    direction: DOWN
- tapOn: "Subgroup by"
- tapOn: "Gender"
- tapOn: "Chart type*"
- tapOn: "Bar Chart"
- tapOn: "Done"
- tapOn:
    id: "floating_action_button" #Edit button
- assertVisible:
    text: "Edit report"
    id: "app_title"
- scrollUntilVisible:
    element:
      text: "Add filter"
    direction: DOWN
- tapOn: "Add filter"
- assertVisible:
    text: "Edit filter"
    id: "app_title"
- tapOn: "Field*"
- tapOn: "Person age"
- tapOn: "Condition*"
- tapOn: "Greater"
- tapOn: "Value*"
- inputText: "13"
- tapOn: "Done"
- tapOn: "Done"
- assertVisible:
    text: "Test Report"
    id: "app_title"
- takeScreenshot: "${TESTRESULTSDIR}/bar_chart_graph_report"
- tapOn: "Reports"
- assertVisible: "Test Report"
- assertVisible:
    text: "Reports"
    id: "app_title"
- tapOn: "Test Report"
- tapOn:
    id: "floating_action_button"
- tapOn: "Time range*"
- tapOn: "Custom period (e.g. last x days/weeks)"
- tapOn: "Days"
- tapOn: "Months"
- scrollUntilVisible:
    element:
      text: "Chart type*"
    direction: DOWN
- tapOn: "Chart type*"
- tapOn: "Line Chart"
- tapOn: "Done"
- assertVisible:
    text: "Test Report"
    id: "app_title"
#- assertVisible: "SHARE"
#- assertVisible: "EXPORT DATA"
- takeScreenshot: "${TESTRESULTSDIR}/line_chart_graph_report"

# Verify student user has no permission to see Reports tab
- runFlow: "common/clear_state_and_get_started.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "stud1"
      PASSWORD: "tests1"
- assertNotVisible: "Reports"