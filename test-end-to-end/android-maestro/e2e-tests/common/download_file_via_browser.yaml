appId: com.toughra.ustadmobile
---
# test files are downloaded from browser

- openLink: "${output.testServerControllerUrl}testcontroller/test-files/content/index.html"
- runFlow:
    file: "../common/chrome-first-run-check.yaml"
- tapOn: ${TESTFILENAME}
- runFlow:
    when:
      visible: "Choose where to download"
    commands:
      - tapOn: "Download"
- runFlow:
      when:
        visible:
          id: "com.google.android.apps.docs:id/pdf_view"
      commands:
           - openLink: "${output.testServerControllerUrl}testcontroller/test-files/content/index.html"
- tapOn: More options
- tapOn: Downloads
- repeat:
      while:
          notVisible: ${TESTFILENAME}
      commands:
          - openLink: "${output.testServerControllerUrl}testcontroller/test-files/content/index.html"
          - runFlow:
                file: "../common/chrome-first-run-check.yaml"
          - tapOn: ${TESTFILENAME}
          - runFlow:
                when:
                    visible: "Choose where to download"
                commands:
                    - tapOn: "Download"

