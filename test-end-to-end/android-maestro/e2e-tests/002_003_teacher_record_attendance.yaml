appId: com.toughra.ustadmobile
tags:
  - courseTest
env:
  TESTRESULTSDIR: "build/reports/maestro/002_003_teacher_record_attendance/Screenshots"
onFlowStart:
  - startRecording: 002_003_teacher_record_attendance
  - runScript:
      file: "common/startserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - stopRecording
  - runScript:
      file: "common/stopserver.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
- runScript:
    file: "common/import_users_via_http.js"
    env:
      TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
      IMPORT_FROM_CSV_FILE: "Ustad_Teacher_and_Students.csv"

- runFlow: "common/clear_state_and_learning_space_existing_userflow.yaml"
- runFlow: "common/select_site.yaml"
- runFlow:
    file: "common/user_login.yaml"
    env:
      USERNAME: "teach1"
      PASSWORD: "testt1"
- runFlow:
    file: "common/record_attendance.yaml"
    env:
      TESTCOURSENAME: "Test Course Block"
- runFlow:
    file: "common/edit_recorded_attendance.yaml"
    env:
      TESTCOURSENAME: "Test Course Block"
- assertVisible: "5 Present, 0 Partial, 1 Absent"