appId: com.toughra.ustadmobile

---
- clearState: com.toughra.ustadmobile
- runFlow:
   file: "../common/startserver.yaml"
   env:
     CONTROLSERVER_URL: ${CONTROLSERVER_URL}
     TESTSERIAL: ${TESTSERIAL}
     TESTNAME: ${TESTNAME}
- launchApp
- tapOn: "GET STARTED"
- tapOn: Site link
- inputText: ${LEARNING_SPACE_URL}
- hideKeyboard
- tapOn: "NEXT"
- tapOn: "Username"
- inputText: ${USERNAME}
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "LOGIN"
- tapOn: "Library"