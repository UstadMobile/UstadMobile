appId: com.toughra.ustadmobile
onFlowStart:
  - runScript:
      file: "../common/startserver.js"
      env:
        CONTROLSERVER_URL: ${CONTROLSERVER_URL}
        TESTSERIAL: ${TESTSERIAL}
        TESTNAME: ${TESTNAME}
  - clearState: com.toughra.ustadmobile
onFlowComplete:
  - runScript:
      file: "../common/stopserver.js"
      env:
        CONTROLSERVER_URL: ${CONTROLSERVER_URL}

---
- launchApp
- tapOn: "GET STARTED"
- tapOn: Site link
- inputText: "${output.SERVER_URL}"
- hideKeyboard
- tapOn: "NEXT"
- tapOn: "Username"
- inputText: ${USERNAME}
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "LOGIN"
- tapOn: "Library"